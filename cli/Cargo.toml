[package]
name = "ibkr-diag"
version = "0.1.0"
edition = "2024"
description = "CLI diagnostics tool for IB Gateway health checks"
license = "MIT"

[[bin]]
name = "ibkr-diag"
path = "src/main.rs"

[dependencies]
ibcore = { path = ".." }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
