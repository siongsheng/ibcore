[package]
name = "ibcore-python"
version = "0.1.1"
edition = "2024"
description = "PyO3 Python bindings for ibcore — market data snapshots, diagnostics, order placement"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
ibcore = { path = ".." }
pyo3 = { version = "0.23", features = ["experimental-async", "chrono", "auto-initialize", "extension-module"] }
tokio = { version = "1", features = ["full"] }
ibapi = "3.0"
chrono = "0.4"
futures = "0.3"
